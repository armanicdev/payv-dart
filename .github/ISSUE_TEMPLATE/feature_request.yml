name: Feature request
description: A script, a table, a PDF feature payv does not handle yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Known gaps are already listed in
        [doc/DEFECTS.md](../../blob/main/doc/DEFECTS.md) and under
        "Not yet" in the README — worth a look first.

  - type: textarea
    id: need
    attributes:
      label: What do you need payv to do
      description: What are you building, and what stops you?
    validations:
      required: true

  - type: textarea
    id: spec
    attributes:
      label: Spec or reference
      description: >-
        The OpenType/PDF/Unicode section that defines it, or how HarfBuzz,
        fontTools or another implementation handles it.
    validations:
      required: false

  - type: checkboxes
    id: help
    attributes:
      label: Would you like to implement it?
      options:
        - label: I'd be willing to open a PR
          required: false
